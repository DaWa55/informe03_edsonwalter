<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walter Bernedo Edson Daniel</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Calculadora -->
    <div class="calculadora">
        <input type="text" id="pantalla" readonly placeholder="0">

        <div class="teclado">
            <!-- fila 1 -->
            <button class="boton" data-tipo="numero" data-valor="7">7</button>
            <button class="boton" data-tipo="numero" data-valor="8">8</button>
            <button class="boton" data-tipo="numero" data-valor="9">9</button>
            <button class="boton operador" data-tipo="operador" data-valor="+">+</button>

            <!-- fila 2 -->
            <button class="boton" data-tipo="numero" data-valor="4">4</button>
            <button class="boton" data-tipo="numero" data-valor="5">5</button>
            <button class="boton" data-tipo="numero" data-valor="6">6</button>
            <button class="boton operador" data-tipo="operador" data-valor="-">-</button>

            <!-- fila 3 -->
            <button class="boton" data-tipo="numero" data-valor="1">1</button>
            <button class="boton" data-tipo="numero" data-valor="2">2</button>
            <button class="boton" data-tipo="numero" data-valor="3">3</button>
            <button class="boton operador" data-tipo="operador" data-valor="*">*</button>

            <!-- fila 4 -->
            <button class="boton" data-tipo="numero" data-valor="0">0</button>
            <button class="boton limpiar" data-tipo="limpiar" data-valor="C">C</button>
            <button class="boton igual" data-tipo="igual" data-valor="=">=</button>
            <button class="boton operador" data-tipo="operador" data-valor="/">/</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
